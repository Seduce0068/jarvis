# CI-1 (safe wiring): manual-dispatch-only review gate.
#
# The full 3-stage pipeline lives in ci/review-gate.yml. That file is kept as
# the reference implementation (it includes auto-merge) and is NOT wired here
# verbatim: auto-merge and PR-triggered execution require credentials and
# policy decisions that are not yet made.
#
# This workflow exposes only the read-only gate-check stage on manual
# dispatch. It never merges, comments, or modifies repository state.
name: Review Gate (manual)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to check (read-only)"
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: review-gate-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  gate-check:
    name: Read-only gate check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # I84-A: 可変タグ @v4 をフル SHA へ固定し、バージョンをコメント併記する。
        # 11d5960a326750d5838078e36cf38b85af677262 = actions/checkout v4
        #   (refs/tags/v4 を 2026-11-20 に解決, commit
        #   "backport fixes to releases-v4 (#2524)", 2026-07-16)
        # 更新時は refs/tags/v4 の解決 SHA を再確認し、このコメントも更新する。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Confirm target PR exists (read-only)
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,title,state
      - name: Run repository gates locally
        # Use the repo's own verified gate suite instead of opencode/CLI.
        # This avoids OpenCode credentials entirely while still checking
        # fmt / check / test / clippy / UI / secret scan / safety guards.
        run: make ci-local
