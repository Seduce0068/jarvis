# 個人リポジトリ共通の再利用可能ワークフロー
# （onoderakeita/workflows の rust-gates.yml）へ委譲する。Rust ワーク
# スペースは rust/ 配下にあるため working_directory で指定する。
# native-tls と protoc（prost-build）用に apt パッケージを導入する。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: onoderakeita/workflows/.github/workflows/rust-gates.yml@v1
    with:
      apt_packages: |
        libssl-dev
        protobuf-compiler
      working_directory: rust
      # Docker is available on ubuntu-latest; run the ignored testcontainers
      # integration test explicitly.
      extra_gates: |
        cargo test -p jarvis-context -- --ignored
