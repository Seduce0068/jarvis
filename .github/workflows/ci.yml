# 個人リポジトリ共通の再利用可能ワークフロー
# （Seduce0068/workflows の rust-gates.yml）へ委譲する。Rust ワーク
# スペースは rust/ 配下にあるため working_directory で指定する。
# native-tls と protoc（prost-build）用に apt パッケージを導入する。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    # I84-A: 共通指示 §5 により参照はタグ `v1` にピン留めする（互換更新はタグの
    # 付け替え、破壊的変更は v2 を切る方針）。タグ自体は可変なので、監査用に
    # 現行の解決先をここへ記録する。
    # 2026-11-20 確認: refs/tags/v1 -> b7675efd8a9a84ebc5b560da628d1a82f3fbf98f
    #   (Seduce0068/workflows, commit "ci(rust-gates): アクションをSHAピン留め
    #   （checkout/rust-cache/install-action）", 2026-11-08)
    # 再確認: `bash ci/scripts/check-workflow-pins.sh`（make check-workflow-pins、
    # make ci-local、および下記 extra_gates）が直近コメントの記録 SHA と
    # GitHub API の現行 SHA を照合し、タグの付け替えを fail-closed で検知する。
    # オフライン時は未検証警告のみ。タグを付け替える場合は上の記録 SHA も
    # 同じコミットで更新すること。
    # §5 の方針に反するため `uses:` 自体は SHA 固定にせず v1 タグを維持する。
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      apt_packages: |
        libssl-dev
        protobuf-compiler
        gcc-aarch64-linux-gnu
        pkg-config
        shellcheck # required by ci/scripts/check-shell.sh extra_gate
      working_directory: rust
      # Global policy: unsafe blocks/functions are forbidden unless explicitly
      # justified with a documented SAFETY comment (common AGENTS.md §15).
      # I68-B: add -D warnings so CI clippy treats all warnings as errors,
      # matching `make ci-local` (Makefile:44) and the documented lint command.
      clippy_args: -D warnings -D clippy::undocumented_unsafe_blocks
      # I68-B: check/test `--locked` is decided inside the shared
      # rust-gates.yml@v1 workflow; its input API is not confirmed here
      # (todo.md「外部事実のため未確認」). No caller-side flag is set to avoid
      # guessing an unsupported input. Locally `make ci-local` already pins
      # `--locked` for cargo check/test (Makefile:42-43). Recorded as-is.
      # aarch64 cross-build (matches rust/scripts/deploy.rs) and the
      # Docker-backed testcontainers integration test.
      extra_gates: |
        sudo dpkg --add-architecture arm64
        # Keep amd64 on the Azure mirror; arm64 packages live on Ubuntu Ports.
        sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
        sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources >/dev/null <<'EOF'
        Types: deb
        URIs: http://ports.ubuntu.com/ubuntu-ports/
        Suites: noble noble-updates noble-backports noble-security
        Components: main restricted universe multiverse
        Architectures: arm64
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        sudo apt-get update
        sudo apt-get install -y libssl-dev:arm64 libc6-dev-arm64-cross
        rustup target add aarch64-unknown-linux-gnu
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        export PKG_CONFIG_ALLOW_CROSS=1
        export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
        cargo check --workspace --target aarch64-unknown-linux-gnu

        # The host build must not inherit the arm64 pkg-config path.
        unset PKG_CONFIG_PATH PKG_CONFIG_ALLOW_CROSS CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
        cargo test -p jarvis-context -- --ignored

        # P1-8 / P2-3: repo-local regression scripts and the standalone GPUI
        # crate are not covered by the shared rust-gates workspace job.
        # The shared workflow runs extra_gates with working_directory: rust,
        # so step back to the repository root before using the Makefile and
        # repo-relative script paths.
        cd ..
        make check-shell
        make check-workflow-pins
        make check-toml
        make check-evidence
        make secret-scan
        make safety-test
        # I24-E: restore-local.sh の合成フィクスチャ回帰（既定 dry-run・本番非接触）。
        # safety-test 経由でも走るが CI ゲートとして明示的に列挙する。
        make test-restore-local
        bash ci/scripts/test-review-run.sh
        make ui-test
