# I93-A: cargo-audit configuration (repo root).
#
# NOT auto-discovered: cargo-audit 0.23 does not read audit.toml from the CWD.
# The gate (ci/scripts/check-dependency-audit.sh) extracts the RUSTSEC IDs from
# [advisories].ignore below and passes each one explicitly as `--ignore` to
# every `cargo audit --no-fetch --file <lock>` scan, so every suppression here
# is explicit and version-controlled. No values, tokens, or host-specific
# paths are stored.
#
# 一時 ignore の根拠（Round 87/88 実測）:
#   patch 版が無い major 更新待ちのため、アップグレード完了まで抑制する。
#   patch 版のある 8 件（tokio / rustls 0.23 / rustls-webpki 0.103 /
#   webpki-roots 1.0 / rustix / pulldown-cmark / ctutils / ui heapless）は
#   Cargo.lock を更新済みのため ignore しない。
#   全 ID は `cargo audit --no-fetch --file rust/Cargo.lock --json` の
#   実測出力から転記した（推測していない）。
#
# 再評価日: 2026-12-20T00:00:00+09:00（全エントリ共通）。
# 期限までに major 更新（hickory 0.26 / rsa 0.10 / rmcp 3.9）を完了するか、
# 抑制を継続する理由を更新すること。理由の無い ignore は削除する。
