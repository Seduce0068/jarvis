syntax = "proto3";

package jarvis.context.v1;

service ContextService {
  rpc BuildContext(BuildContextRequest) returns (BuildContextResponse);
  rpc StoreMemory(StoreMemoryRequest) returns (StoreMemoryResponse);
  rpc SearchMemory(SearchMemoryRequest) returns (SearchMemoryResponse);
}

message BuildContextRequest {
  string event_id = 1;
  string event_type = 2;
  string payload = 3;
  string correlation_id = 4;
  // Additive event correlation metadata (I31-B). Field numbers 1-4 and their
  // types are unchanged; older clients leave these unset (""/0) and the
  // handler keeps its legacy source=Manual / timestamp=now behavior.
  string source = 5;
  int64 timestamp = 6;
}

message BuildContextResponse {
  string context = 1;
}

message StoreMemoryRequest {
  string id = 1;
  string content = 2;
  repeated float embedding = 3;
  string metadata = 4;
  string source = 5;
  int64 expires_at = 6;
}

message StoreMemoryResponse {
  string id = 1;
}

message SearchMemoryRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchMemoryResponse {
  repeated MemoryEntry memories = 1;
}

message MemoryEntry {
  string id = 1;
  string content = 2;
  repeated float embedding = 3;
  string metadata = 4;
  string source = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  int64 expires_at = 8;
  // Additive: vector-search similarity, absent for non-ranked entries.
  // Older clients ignore field 9; older servers leave it unset.
  optional float score = 9;
}

message Empty {}
