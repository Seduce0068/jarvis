[package]
name = "jarvis-core"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "JARVIS Core: Shared types and traits"

[dependencies]
# Workspace
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# Shared SHA-256 primitive used by the kill switch and gateway token gates.
sha2 = { workspace = true }
# HTTP-only: the shared `BareJson` extractor needs these. Pure-Rust consumers
# (e.g. the standalone GPUI UI) must not pull axum/tracing transitively.
axum = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
# Enables the axum-based `BareJson` extractor and its rejection vocabulary.
http = ["dep:axum", "dep:tracing"]

[lib]
name = "jarvis_core"
path = "src/lib.rs"

[lints]
workspace = true
