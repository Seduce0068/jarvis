syntax = "proto3";

package jarvis.policy.v1;

service PolicyService {
  rpc Check(CheckRequest) returns (CheckResponse);
  rpc GetKillSwitchStatus(Empty) returns (KillSwitchStatusResponse);
  rpc ActivateKillSwitch(ActivateKillSwitchRequest) returns (Empty);
  rpc DeactivateKillSwitch(DeactivateKillSwitchRequest) returns (Empty);
}

message CheckRequest {
  string principal = 1;
  string action = 2;
  string resource = 3;
  string context = 4;
}

message CheckResponse {
  bool allowed = 1;
  // Additive field 2: a fixed, non-sensitive reason for the decision, e.g.
  // "allowed", "kill_switch", "rbac_denied", "cedar_denied" or
  // "evaluation_error". Old clients may ignore it; the existing `allowed`
  // field keeps its meaning.
  string reason = 2;
}

message KillSwitchStatusResponse {
  bool activated = 1;
  int64 activated_at = 2;
  string reason = 3;
  string activated_by = 4;
}

message ActivateKillSwitchRequest {
  string reason = 1;
  string admin_token = 2;
}

message DeactivateKillSwitchRequest {
  string admin_token = 1;
}

message Empty {}
