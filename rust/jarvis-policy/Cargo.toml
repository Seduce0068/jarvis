[package]
name = "jarvis-policy"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "JARVIS Policy Engine: Cedar/Casbin-based authorization, approval gates, kill switch"

[dependencies]
# Workspace
jarvis-core = { workspace = true }
tokio = { workspace = true, features = ["full", "tracing"] }
async-trait = { workspace = true } # object-safe ApprovalPersistence seam (I29-A)
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing-opentelemetry = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
figment = { workspace = true }
# zeroize は参照0のため削除。Secret の明示的消去を実装するなら再宣言。
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Durable approval persistence (I30-A, 案A)
tokio-postgres = { workspace = true }

# Policy
cedar-policy = { workspace = true }
casbin = { workspace = true }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }
futures-util = { workspace = true }
# prost-types は参照0のため削除。well-known types を使うなら再宣言。
tonic-prost = { workspace = true }

# HTTP
axum = { workspace = true }
# tower-http は参照0のため削除。CORS / trace / limit ミドルウェアを追加するなら再宣言。

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
# mockall / proptest は参照0のため削除（workspace 宣言も削除）。
# 再導入時は workspace と同時に宣言する。
reqwest = { workspace = true }

[[bin]]
name = "jarvis-policy"
path = "src/main.rs"

[lib]
name = "jarvis_policy"
path = "src/lib.rs"

[lints]
workspace = true
