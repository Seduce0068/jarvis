syntax = "proto3";

package jarvis.event.v1;

service EventService {
  rpc EmitEvent(EmitEventRequest) returns (EmitEventResponse);
}

message EmitEventRequest {
  string id = 1;
  string source = 2;
  string event_type = 3;
  string payload = 4;
  int64 timestamp = 5;
  string correlation_id = 6;
}

message EmitEventResponse {
  bool success = 1;
  // Additive field: old clients ignore unknown fields and keep working.
  // Mirrors the HTTP `/v1/events` response's canonical event id string.
  string event_id = 2;
}
