[package]
name = "jarvis-event"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "JARVIS Event Normalizer: HA, Android, external APIs → unified events"

[dependencies]
# Workspace
tokio = { workspace = true, features = ["full", "tracing"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing-opentelemetry = { workspace = true }
metrics = { workspace = true }
figment = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# HTTP server for webhooks
axum = { workspace = true }
tower-http = { workspace = true }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }
tonic-prost = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Logging
tracing-subscriber = { workspace = true }

# Core types
jarvis-core = { path = "../jarvis-core" }

# Policy client
jarvis-policy = { path = "../jarvis-policy" }

# Context client
jarvis-context = { path = "../jarvis-context" }

# WebSocket (Home Assistant / Android)
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = { workspace = true }

# Secrets

# Metrics
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
mockall = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[[bin]]
name = "jarvis-event"
path = "src/main.rs"

[lib]
name = "jarvis_event"
path = "src/lib.rs"

[lints]
workspace = true
