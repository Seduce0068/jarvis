[workspace]
resolver = "2"
members = [
    "jarvis-core",
    "jarvis-policy",
    "jarvis-mcp-gw",
    "jarvis-event",
    "jarvis-context",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV: matches the locally installed stable toolchain (rustup channel manifest, read-only check).
rust-version = "1.100"
license = "MIT OR Apache-2.0"
authors = ["Sovereign AI Agent"]
repository = "https://github.com/Seduce0068/jarvis"

# Workspace-wide lint declarations. Each crate must opt in with
# `lints.workspace = true` in its [package] table for these to take effect.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Local crates
jarvis-core = { path = "jarvis-core" }

# Async runtime
tokio = { version = "1.40", features = ["full", "tracing"] }
async-trait = "0.1.79"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
# `json` feature は未使用（全 config が TOML/env/Serialized provider のみ）。JSON 設定ファイル対応時に再追加。
figment = { version = "0.10", features = ["toml", "env"] }
# zeroize は参照0のため削除。Secret をメモリ上で明示的に消去する実装を入れるなら再宣言。

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
opentelemetry = { version = "0.33", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.33"
tracing-opentelemetry = "0.34"
metrics = "0.22"
metrics-exporter-prometheus = { version = "0.14", default-features = false }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# gRPC / HTTP
tonic = { version = "0.14", features = ["tls-ring", "transport"] }
prost = "0.14"
# prost-types は参照0のため削除。well-known types (Timestamp/Duration 等) を使うなら再宣言。
tonic-prost = "0.14"
tonic-prost-build = "0.14"
# 依存グラフ安全性メモ（2026-11-19 調査、Cargo.lock 照合済み）:
# - 直接依存の axum は 0.7.9。axum 0.8.9 は tonic 0.14.6 が要求する（tonic の server 実装が
#   axum 0.8 を前提）。tower-http 0.6.11 の dependencies に axum は無く、
#   「tower-http 0.6 が axum 0.8 を要求」という仮説は Cargo.lock 上で否定された。
# - axum 0.7.9 を要求するのは jarvis-policy / jarvis-mcp-gw / jarvis-event / jarvis-context の
#   4 crate（いずれも workspace 依存）。axum 0.8.9 の参照は tonic 0.14.6 のみ。
# - 統一には axum 0.7 -> 0.8 の major update が必要だが、4 crate のルータ/ハンドラ
#   （Router, from_fn_with_state, State, axum::serve 等、src 全体で 146 参照）に
#   破壊的変更が及ぶリスクがあり、manifest/lock のみを担当する本作業では型整合を検証できない。
#   tonic 0.14 -> 0.13 への downgrade も prost / tonic-prost / tonic-prost-build の
#   連鎖変更と gRPC サーバの再検証が必要で同等以上にリスクが高い。
# - よって現状維持（0.7 + 0.8 共存）とする。統一は cargo check --workspace / test を
#   伴う専用の移行タスクで判断する。
# - 影響: axum-core 0.4.5/0.5.6、matchit 0.7.3/0.8.4 等が重複し、バイナリサイズ・
#   コンパイル時間・Heavy 依存が増加する（実測値は未確認）。
axum = { version = "0.7", features = ["tracing"] }
# tower-http は参照0のため削除。CORS / trace / body-limit ミドルウェアを追加するなら再宣言。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"

# Policy / Auth
cedar-policy = "4.13"
casbin = "2.0"

# MCP - use older stable version that works
rmcp = { version = "0.3", features = [
    "server",
    "client",
    "transport-io",
    # `transport-child-process` / `transport-sse-client` は参照0のため削除。
    # stdio 子プロセス transport / SSE client を導入するなら再宣言。
    # `transport-streamable-http-client` と `reqwest` はテストで使用するため維持。
    "transport-streamable-http-server",
    "transport-streamable-http-client",
    "reqwest",
] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }

# Vector DB
# I84-A: `version = "1.10"` (^1.10) は 1.19.0 へ解決し、reqwest 0.13.5 を推移的に
# 混入させていた（Cargo.lock:3242-3263）。再現性・監査性のため exact pin
# (`=1.19.0`) を採用した。lock 上の解決版は既に 1.19.0 なので Cargo.lock の
# 差分は無く、`cargo check/test --locked` の整合も変わらない。
# reqwest major 重複の共存理由と影響（axum 共存メモ :65-79 と同形式）:
# - 0.12.28 は workspace 直接依存（default-features = false, json + rustls-tls）。
#   0.13.5 は qdrant-client 1.19.0 が内部で要求する推移依存（Cargo.lock:3531 / :3578）。
# - 直接依存する 4 crate（jarvis-event / jarvis-policy / jarvis-context /
#   jarvis-mcp-gw）はすべて `reqwest = { workspace = true }`。0.12 -> 0.13 への
#   統一は breaking change を伴い、http / sandbox / egress の実装と lock の
#   再解決を要する。本作業は manifest/lock のみが担当範囲のため、型整合を検証
#   できないため、低コストで安全な exact pin を選択した（方針として記録）。
# - 影響: base 0.22.1/0.23.1、wasm-streams 0.4.2/0.5.0、
#   rustls-platform-verifier（0.13 側のみ）等が重複し、バイナリサイズ・
#   コンパイル時間が増加する。実測値は未確認（axum メモと同様）。
# I85-B 再評価（2026-11-20、manifest/lock のみ担当・shell 検証不可）:
# - Cargo.lock 照合で reqwest 0.12.28 は上記 4 crate に加え rmcp 0.3
#   (:3683) と testcontainers 0.20 (:4701) からも要求されている。
#   workspace の reqwest を 0.13 へ上げてもこれら 2 crate は 0.12 系に
#   留まり、「0.12 系が lock から消える」条件は workspace 単独では成立しない。
# - 0.13.5 は qdrant-client に加え opentelemetry-http / opentelemetry-otlp
#   0.33.1 (:2757 / :2773) からも要求され、major 重複は既に広範。
# - 0.12 -> 0.13 は breaking change で 4 crate の利用側実装の型整合を要するが、
#   本担当はサービス側ソース編集・shell 実行が禁止され cargo check で
#   検証できない。優先度低のため現状維持（exact pin + 共存）を選択。
#   Cargo.lock は未変更。
qdrant-client = { version = "=1.19.0", features = ["reqwest", "uuid"] }

# Object Storage

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
# v7 (時刻順序 UUID) は参照0のため削除。順序付き ID が必要になったら再追加。v4 は本番/テストで使用中。
uuid = { version = "1.8", features = ["serde", "v4"] }

# CLI

# Crypto
sha2 = "0.10"
hex = "0.4"

# Testing
testcontainers = { version = "0.20", features = ["default"] }
# mockall / proptest は参照0のため削除。mock / property-based テストを導入するなら再宣言。

# Build dependencies

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"
overflow-checks = true

[profile.dev.package."*"]
debug = false
