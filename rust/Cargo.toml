[workspace]
resolver = "2"
members = [
    "jarvis-core",
    "jarvis-policy",
    "jarvis-mcp-gw",
    "jarvis-event",
    "jarvis-context",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV: matches the locally installed stable toolchain (rustup channel manifest, read-only check).
rust-version = "1.100"
license = "MIT OR Apache-2.0"
authors = ["Sovereign AI Agent"]
repository = "https://github.com/Seduce0068/jarvis"

# Workspace-wide lint declarations. Each crate must opt in with
# `lints.workspace = true` in its [package] table for these to take effect.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full", "tracing"] }
async-trait = "0.1.79"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
figment = { version = "0.10", features = ["toml", "env", "json"] }
zeroize = "1.8"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
opentelemetry = { version = "0.33", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.33"
tracing-opentelemetry = "0.34"
metrics = "0.22"
metrics-exporter-prometheus = { version = "0.14", default-features = false }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# gRPC / HTTP
tonic = { version = "0.14", features = ["tls-ring", "transport"] }
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
axum = { version = "0.7", features = ["tracing"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"

# Policy / Auth
cedar-policy = "4.13"
casbin = "2.0"

# MCP - use older stable version that works
rmcp = { version = "0.3", features = [
    "server",
    "client",
    "transport-io",
    "transport-child-process",
    "transport-sse-client",
    "transport-streamable-http-server",
    "transport-streamable-http-client",
    "reqwest",
] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }

# Vector DB
qdrant-client = { version = "1.10", features = ["reqwest", "uuid"] }

# Object Storage

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.8", features = ["serde", "v4", "v7"] }

# CLI

# Crypto
sha2 = "0.10"
hex = "0.4"

# Testing
testcontainers = { version = "0.20", features = ["default"] }
mockall = "0.13"
proptest = "1.4"

# Build dependencies

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"
overflow-checks = true

[profile.dev.package."*"]
debug = false
