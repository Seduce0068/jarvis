# CI-1: not wired into .github/workflows/ (manual/reference pipeline only).
# CI-2: depends on OpenCode CLI/credentials and a runner with JARVIS toolchain.
# See docs/integration/remaining-tasks.md for current status and decisions.
name: JARVIS Review Flow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run gate-check on"
        required: true
        type: number

env:
  OPENCODE_CLI_CONFIG_CONTENT: '{"session":{"permissions":"autoaccept"}}'

jobs:
  # Stage 1: Automated Gates (must pass)
  gate-check:
    name: Stage 1 - Automated Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
      summary: ${{ steps.gate.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install review-flow tools
        run: |
          # Install gitleaks, trufflehog, madge, etc.
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz | tar -xz -C /usr/local/bin
          curl -fsSL https://github.com/trufflesecurity/trufflehog/releases/latest/download/trufflehog_linux_amd64.tar.gz | tar -xz -C /usr/local/bin
          npm install -g madge

      - name: Run gate-check
        id: gate
        run: |
          opencode run "/review-flow gate-check ${{ github.event.pull_request.number || github.event.inputs.pr_number }}" --json > gate-result.json
          cat gate-result.json
          PASSED=$(jq -r '.passed' gate-result.json)
          SUMMARY=$(jq -c '.summary' gate-result.json)
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: gate-result.json
          retention-days: 7

      - name: Post gate status
        if: always()
        run: |
          if [ "${{ steps.gate.outputs.passed }}" = "true" ]; then
            gh pr check "Review Gate" --conclusion success --output "All gates passed"
          else
            gh pr check "Review Gate" --conclusion failure --output "Gate failed: ${{ steps.gate.outputs.summary }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2: Cross Review (security, arch, ops)
  cross-review:
    name: Stage 2 - Cross Review
    needs: gate-check
    if: needs.gate-check.outputs.passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run cross-review
        run: |
          opencode run "/cross-review" > cross-review-result.md
          cat cross-review-result.md

      - name: Parse review results
        id: review
        run: |
          # Count findings by severity
          CRITICAL=$(grep -c "Critical" cross-review-result.md || true)
          HIGH=$(grep -c "High" cross-review-result.md || true)
          MEDIUM=$(grep -c "Medium" cross-review-result.md || true)
          LOW=$(grep -c "Low" cross-review-result.md || true)

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT

          # Determine verdict
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "verdict=REJECT" >> $GITHUB_OUTPUT
          elif [ "$MEDIUM" -gt 0 ]; then
            echo "verdict=CONDITIONAL" >> $GITHUB_OUTPUT
          else
            echo "verdict=APPROVE" >> $GITHUB_OUTPUT
          fi

      - name: Upload review results
        uses: actions/upload-artifact@v4
        with:
          name: cross-review-results
          path: cross-review-result.md
          retention-days: 30

      - name: Post review summary
        run: |
          gh pr comment --body-file cross-review-result.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail on Critical/High
        if: steps.review.outputs.verdict == 'REJECT'
        run: |
          echo "::error::Cross-review found Critical/High severity issues. Review rejected."
          exit 1

  # Stage 3: Merge Gate (re-run gates before merge)
  merge-gate:
    name: Stage 3 - Merge Gate
    needs: [gate-check, cross-review]
    if: needs.cross-review.outputs.verdict != 'REJECT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Re-run gate-check (regression prevention)
        run: |
          opencode run "/review-flow gate-check ${{ github.event.pull_request.number }}" --json > merge-gate-result.json
          PASSED=$(jq -r '.passed' merge-gate-result.json)
          if [ "$PASSED" != "true" ]; then
            echo "::error::Merge gate failed - regression detected"
            exit 1
          fi

  # Auto-merge when all stages pass
  auto-merge:
    name: Auto Merge
    needs: [gate-check, cross-review, merge-gate]
    if: |
      needs.gate-check.outputs.passed == 'true' &&
      needs.cross-review.outputs.verdict != 'REJECT' &&
      needs.merge-gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: |
          gh pr merge --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Metrics collection
  metrics:
    name: Collect Metrics
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Collect review metrics
        run: |
          opencode run "/review-flow metrics --days 30 --json" > metrics.json
          cat metrics.json

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: review-metrics
          path: metrics.json
          retention-days: 90
