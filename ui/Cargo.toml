[package]
name = "jarvis-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
authors = ["Sovereign AI Agent"]
repository = "https://github.com/Seduce0068/jarvis"
description = "JARVIS desktop console (GPUI): human approval queue for policy-gated MCP tool calls"

# Standalone workspace: this crate is deliberately NOT a member of
# `rust/Cargo.toml`. CI cross-builds the Rust workspace for
# `aarch64-unknown-linux-gnu` (see .github/workflows/ci.yml), and the GPUI
# stack does not cross-compile without a full native graphics sysroot.
# See adr/0005-gpui-desktop-adoption.md.
[workspace]

[dependencies]
# Canonical approval domain (P1-7, 案A). This is a path dependency because the
# UI is a standalone workspace and cannot use rust/Cargo.toml's
# workspace.dependencies. jarvis-core gates its axum/tracing `BareJson`
# extractor behind the opt-in `http` feature, which this default-feature
# dependency does not enable: the UI therefore pulls only
# anyhow/serde/serde_json/chrono/uuid from it and stays clear of the axum 0.7
# HTTP server stack (and the GPUI cross-compile boundary).
jarvis-core = { path = "../rust/jarvis-core" }
# GPUI is not published under its own name on crates.io; `gpui-pre` is the
# maintained snapshot (`zed@d2a4fb6`) published by the Zed authors.
gpui = { package = "gpui-pre", version = "0.3.12" }
# Platform entry point (`application()`), published alongside the snapshot.
gpui_platform = { package = "gpui-pre-platform", version = "0.3.12" }

# Blocking HTTP client: GPUI drives its own executor, not Tokio, so reqwest's
# reactor is unavailable here. Requests run on GPUI's background thread pool.
ureq = { version = "3.5", features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# v4 は UI 側で未使用（ID は parse のみ）。生成が必要になったら再追加。
uuid = { version = "1.8", features = ["serde"] }
anyhow = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
