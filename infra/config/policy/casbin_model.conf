# JARVIS Casbin RBAC Model
# Role-Based Access Control for fast-path authorization.
# Objects and actions support a trailing '*' wildcard via keyMatch.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch(r.obj, p.obj) && keyMatch(r.act, p.act)
