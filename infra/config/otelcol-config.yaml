# OpenTelemetry Collector Configuration for JARVIS
# Sends traces, metrics, logs to Grafana Cloud Free Tier
# NOTE: the deployed unit reads /etc/jarvis/otelcol-config.yaml. Editing this
# repository template does not change the running collector until it is synced.

extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  pprof:
    endpoint: 127.0.0.1:1777
  zpages:
    endpoint: 127.0.0.1:55679

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'jarvis-policy'
          static_configs:
            - targets: ['localhost:8081']
          metrics_path: '/metrics'

        - job_name: 'jarvis-mcp-gw'
          static_configs:
            - targets: ['localhost:8082']
          metrics_path: '/metrics'

        - job_name: 'jarvis-event'
          static_configs:
            - targets: ['localhost:8083']
          metrics_path: '/metrics'

        - job_name: 'jarvis-context'
          static_configs:
            - targets: ['localhost:8084']
          metrics_path: '/metrics'

        - job_name: 'qdrant'
          static_configs:
            - targets: ['localhost:6333']

        # I105-B: scrape the collector's own telemetry (service.telemetry.metrics
        # pull reader on 127.0.0.1:8888) so drops and memory_limiter activity are
        # visible in Grafana instead of the collector monitoring only others.
        - job_name: 'otelcol'
          static_configs:
            - targets: ['localhost:8888']
          metrics_path: '/metrics'

  # journald receiver for JARVIS systemd units
  # 全サービスが journal へ出力するため /var/log/jarvis/*.log は空だった。
  journald:
    directory: /var/log/journal
    units:
      - jarvis-policy.service
      - jarvis-mcp-gw.service
      - jarvis-event.service
      - jarvis-context.service
      - jarvis-migrations.service
      - jarvis-backup.service
      - jarvis-backup.timer

processors:
  # Batch processor for efficient export
  batch:
    timeout: 10s
    send_batch_size: 1000
    send_batch_max_size: 2000

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  # Resource processor to add common attributes
  resource:
    attributes:
      - key: service.namespace
        value: "jarvis"
        action: insert
      - key: deployment.environment
        value: "prod"
        action: insert
      - key: host.name
        value: "${env:HOSTNAME:-jarvis-host}"
        action: insert

  # Transform processor for common transformations
  transform:
    trace_statements:
      - context: span
        statements:
          - set(attributes["jarvis.correlation_id"], attributes["correlation_id"]) where attributes["correlation_id"] != nil
          - set(attributes["jarvis.event_source"], attributes["event_source"]) where attributes["event_source"] != nil

  # Filter processor to drop noisy spans.
  # I93-B adopted policy: keep an explicit INCLUDE allowlist and extend it with
  # the real span names; do NOT switch to exclude-only. Exclude-only would ship
  # every framework/library span to Grafana Cloud (volume + attribute exposure).
  # This repo instruments with plain `#[instrument]` (no `name = ...`), so the
  # emitted span name is the Rust function name (check / process_event /
  # approve_approval / ...). The four legacy prefixes remain for any future
  # named spans; the anchored alternation below covers today's defaults.
  # IMPORTANT: when adding/renaming an instrumented function, update this list
  # in the SAME change (see docs/integration/evidence-regeneration.md).
  # Otherwise the new spans are silently dropped and the jarvis.correlation_id
  # attribute set by `transform` above never reaches Grafana Cloud.
  filter:
    spans:
      include:
        match_type: regexp
        span_names:
          - "jarvis.*"
          - "opencode.*"
          - "mcp.*"
          - "policy.*"
          - "^(ha_webhook|android_webhook|gmail_webhook|calendar_webhook|process_event|emit_event|build_context|store_memory|search_memory|is_authorized|execute_tool|check|request_approval|approve_approval|deny_approval|approval_status|list_approvals)$"
      exclude:
        match_type: strict
        span_names: ["health.check", "metrics.scrape"]

  # Tail sampling for traces (keep errors, sample successes)
  tail_sampling:
    decision_wait: 30s
    num_traces: 10000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors
        type: string_attribute
        string_attribute:
          key: "status.code"
          values: ["ERROR", "2"]  # gRPC error codes
      - name: slow
        type: latency
        latency:
          threshold_ms: 5000
      # I104-B: the former `jarvis-critical` policy keyed on `jarvis.severity`,
      # but no span producer in this repo emits that attribute (grep: 1 hit,
      # the policy itself). Tail-sampling policies are OR-evaluated, so critical
      # traces were already retained by the `errors` policy (status.code ERROR).
      # The dead policy was removed instead of inventing a severity source.
      - name: probabilistic
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  # Prometheus Remote Write for metrics
  prometheusremotewrite:
    endpoint: "https://prometheus-prod-49-prod-ap-northeast-0.grafana.net/api/prom/push"
    headers:
      Authorization: "Basic ${env:GRAFANA_CLOUD_AUTH}"

  # Debug exporter (for troubleshooting)
  debug:
    verbosity: detailed
    sampling_initial: 10
    sampling_thereafter: 100

  # OTLP exporter -> Grafana Cloud (traces + logs).
  # No endpoint or credential value is stored in this file: both are resolved
  # from environment variables at collector startup.
  #   GRAFANA_CLOUD_OTLP_ENDPOINT  e.g. otlp-gateway-prod-xx-xx.grafana.net:4317
  #                               (gRPC/TLS), or https://otlp-gateway-prod-xx-xx.grafana.net:4318 (HTTP)
  #   GRAFANA_CLOUD_AUTH           base64("<instanceID>:<apiKey>"), same value
  #                               already used by prometheusremotewrite above.
  # UNSET ENV BEHAVIOUR: an unresolved ${env:...} reference makes config loading
  # fail, so the collector REFUSES TO START (it does not silently skip the
  # exporter and does not send data to Grafana). On builds that substitute an
  # empty string instead, the exporter starts with an empty endpoint/auth and
  # cannot export. Either way nothing is shipped until the vars are supplied.
  # Providing values (e.g. via /etc/jarvis/bws.env or a root-owned unit
  # EnvironmentFile) is a separate operator decision (P0-7); only references
  # are declared here. bws.env itself is not touched by this config change.
  otlp/grafana:
    endpoint: "${env:GRAFANA_CLOUD_OTLP_ENDPOINT}"
    headers:
      Authorization: "Basic ${env:GRAFANA_CLOUD_AUTH}"

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, transform, filter, tail_sampling]
      exporters: [debug, otlp/grafana]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheusremotewrite, debug]

    logs:
      receivers: [otlp, journald]
      processors: [memory_limiter, batch, resource]
      exporters: [debug, otlp/grafana]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
