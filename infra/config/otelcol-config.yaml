# OpenTelemetry Collector Configuration for JARVIS
# Sends traces, metrics, logs to Grafana Cloud Free Tier
# NOTE: the deployed unit reads /etc/jarvis/otelcol-config.yaml. Editing this
# repository template does not change the running collector until it is synced.

extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  pprof:
    endpoint: 127.0.0.1:1777
  zpages:
    endpoint: 127.0.0.1:55679

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'jarvis-policy'
          static_configs:
            - targets: ['localhost:8081']
          metrics_path: '/metrics'

        - job_name: 'jarvis-mcp-gw'
          static_configs:
            - targets: ['localhost:8082']
          metrics_path: '/metrics'

        - job_name: 'jarvis-event'
          static_configs:
            - targets: ['localhost:8083']
          metrics_path: '/metrics'

        - job_name: 'jarvis-context'
          static_configs:
            - targets: ['localhost:8084']
          metrics_path: '/metrics'

        - job_name: 'qdrant'
          static_configs:
            - targets: ['localhost:6333']

  # File log receiver for systemd journals
  filelog:
    include:
      - /var/log/jarvis/*.log
    include_file_path: true
    include_file_name: false

processors:
  # Batch processor for efficient export
  batch:
    timeout: 10s
    send_batch_size: 1000
    send_batch_max_size: 2000

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  # Resource processor to add common attributes
  resource:
    attributes:
      - key: service.namespace
        value: "jarvis"
        action: insert
      - key: deployment.environment
        value: "prod"
        action: insert
      - key: host.name
        value: "${env:HOSTNAME:-jarvis-host}"
        action: insert

  # Transform processor for common transformations
  transform:
    trace_statements:
      - context: span
        statements:
          - set(attributes["jarvis.correlation_id"], attributes["correlation_id"]) where attributes["correlation_id"] != nil
          - set(attributes["jarvis.event_source"], attributes["event_source"]) where attributes["event_source"] != nil

  # Filter processor to drop noisy spans
  filter:
    spans:
      include:
        match_type: regexp
        span_names: ["jarvis.*", "opencode.*", "mcp.*", "policy.*"]
      exclude:
        match_type: strict
        span_names: ["health.check", "metrics.scrape"]

  # Tail sampling for traces (keep errors, sample successes)
  tail_sampling:
    decision_wait: 30s
    num_traces: 10000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors
        type: string_attribute
        string_attribute:
          key: "status.code"
          values: ["ERROR", "2"]  # gRPC error codes
      - name: slow
        type: latency
        latency:
          threshold_ms: 5000
      - name: jarvis-critical
        type: string_attribute
        string_attribute:
          key: "jarvis.severity"
          values: ["critical", "high"]
      - name: probabilistic
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  # Prometheus Remote Write for metrics
  prometheusremotewrite:
    endpoint: "https://prometheus-prod-49-prod-ap-northeast-0.grafana.net/api/prom/push"
    headers:
      Authorization: "Basic ${env:GRAFANA_CLOUD_AUTH}"

  # Debug exporter (for troubleshooting)
  debug:
    verbosity: detailed
    sampling_initial: 10
    sampling_thereafter: 100

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, transform, filter, tail_sampling]
      exporters: [debug]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheusremotewrite, debug]

    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, batch, resource]
      exporters: [debug]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
