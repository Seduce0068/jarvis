# JARVIS MCP Allowlist Configuration
# Tools allowed to be executed via MCP Gateway
#
# NOTE: top-level keys must come before the first [[tools]] header - in TOML
# any key placed after a table header belongs to that table, which would make
# the configuration fail to parse.
#
# NOTE: the clamp to 1_000..=15_000 applies ONLY to the web.fetch native
# handler (`native_web_fetch` in sandbox.rs); a value above 15000 has no effect
# on that route, so web.fetch stays at 15000. Other execution routes use the
# raw timeout_ms value with no clamp: `execute_tool`'s generic upstream path
# in gateway.rs (github.create_pr / web.search / shell.execute). Those are kept
# at 30000 so legitimate long-running calls are not cut off. Line numbers are
# intentionally omitted to avoid drifting when the implementation moves.

# Principals allowed to use MCP Gateway
principals = ["jarvis", "opencode", "user"]

[[tools]]
name = "filesystem.read"
description = "Read files from workspace"
allowed_principals = ["jarvis", "opencode", "user"]
max_args_size = 1048576
timeout_ms = 5000
requires_approval = false

[[tools]]
name = "filesystem.write"
description = "Write files to workspace"
allowed_principals = ["jarvis", "opencode", "user"]
max_args_size = 1048576
timeout_ms = 5000
requires_approval = true

